name: grimoire-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: grimoire-postgres-dev
    environment:
      POSTGRES_DB: grimoire
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: grimoire
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - grimoire-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire -d grimoire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grimoire-pgdata:
