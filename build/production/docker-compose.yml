name: grimoire

# Production topology for Cloudmax: Postgres (destilled Grimoire DB) + API + static
# front, fronted by an external Traefik. Images are built from the repository root as
# build context. Set the secrets via an .env file next to this compose.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: grimoire
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grimoire-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire -d grimoire"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Self-hosted embeddings (invariant 1 / D6). Only semantic search (B2) needs it live: the
  # catalogue's 175k vectors are already computed, and serving a rite invokes no model at all.
  # On the INTERNAL network with no host port — Ollama has no auth of its own, so nothing but the
  # API may reach it. Without this the API embeds nothing and B2 answers 503.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - grimoire-ollama-models:/root/.ollama

  api:
    build:
      context: ../..
      dockerfile: src/web/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ConnectionStrings__Grimoire: "Host=postgres;Port=5432;Database=grimoire;Username=grimoire;Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: grimoire
      Jwt__Audience: grimoire-client
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__Origins__0: "https://${GRIMOIRE_HOST}"
      Ollama__BaseUrl: "http://ollama:11434/"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grimoire-api.rule=Host(`${GRIMOIRE_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.grimoire-api.entrypoints=websecure"
      - "traefik.http.routers.grimoire-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.grimoire-api.loadbalancer.server.port=8080"

  front:
    build:
      context: ../..
      dockerfile: src/front/Dockerfile
      args:
        # The ORIGIN, with no /api suffix: the client already prefixes /api on every path.
        VITE_API_URL: "https://${GRIMOIRE_HOST}"
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grimoire-front.rule=Host(`${GRIMOIRE_HOST}`)"
      - "traefik.http.routers.grimoire-front.entrypoints=websecure"
      - "traefik.http.routers.grimoire-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.grimoire-front.loadbalancer.server.port=80"

volumes:
  grimoire-pgdata:
  grimoire-ollama-models:
